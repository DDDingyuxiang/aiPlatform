name: aiplatform

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ai_platform
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/database/mysql:/docker-entrypoint-initdb.d:ro
    # 默认不对宿主机发布端口；本地调试可用 docker-compose.dev.yml
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 知识库向量索引：只保存可重建的向量，权威业务数据仍在 MySQL
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  # 独立 AI 服务：默认连接宿主机 Ollama（WSL / Docker Desktop 均通过 host.docker.internal）
  ai-service:
    build:
      context: ./ai-service
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-local:latest}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-1024}
      OLLAMA_TASK_NUM_PREDICT: ${OLLAMA_TASK_NUM_PREDICT:-256}
      OLLAMA_SUMMARY_NUM_PREDICT: ${OLLAMA_SUMMARY_NUM_PREDICT:-512}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NO_THINK_FALLBACK: ${OLLAMA_NO_THINK_FALLBACK:-true}
      # BGE-M3 ONNX 模型目录需包含 onnx/model.onnx、model.onnx_data、tokenizer.json
      EMBEDDING_MODEL_PATH: /models/bge-m3
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      EMBEDDING_MAX_LENGTH: ${EMBEDDING_MAX_LENGTH:-512}
    volumes:
      - "${BGE_M3_MODEL_DIR:-./models/bge-m3}:/models/bge-m3:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # 一次性初始化：建公司、角色、管理员账号与演示考勤
  seed:
    image: aiplatform-backend:local
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ai_platform
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?请在 .env 中设置 SEED_ADMIN_PASSWORD}
      SEED_COMPANY_CODE: ${SEED_COMPANY_CODE:-demo}
      SEED_COMPANY_NAME: ${SEED_COMPANY_NAME:-演示企业}
    command: ["node", "dist/scripts/seed-dev.js"]

  backend:
    image: aiplatform-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      ai-service:
        condition: service_started
      qdrant:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-7200}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ai_platform
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      AI_SERVICE_URL: http://ai-service:8000
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-180000}
      AI_CONTEXT_MAX_TOKENS: ${AI_CONTEXT_MAX_TOKENS:-6000}
      AI_CONTEXT_OVERHEAD_TOKENS: ${AI_CONTEXT_OVERHEAD_TOKENS:-256}
      AI_CONTEXT_HISTORY_MESSAGES: ${AI_CONTEXT_HISTORY_MESSAGES:-32}
      AI_RAG_CONTEXT_CHARS: ${AI_RAG_CONTEXT_CHARS:-4000}
      AI_RAG_TIMEOUT_MS: ${AI_RAG_TIMEOUT_MS:-3000}
      AI_SUMMARY_ENABLED: ${AI_SUMMARY_ENABLED:-true}
      AI_SUMMARY_TRIGGER_TOKENS: ${AI_SUMMARY_TRIGGER_TOKENS:-2500}
      AI_SUMMARY_KEEP_RECENT_MESSAGES: ${AI_SUMMARY_KEEP_RECENT_MESSAGES:-8}
      AI_SUMMARY_MAX_CHARS: ${AI_SUMMARY_MAX_CHARS:-1200}
      AI_SUMMARY_TIMEOUT_MS: ${AI_SUMMARY_TIMEOUT_MS:-180000}
      AI_CONVERSATION_PAGE_SIZE: ${AI_CONVERSATION_PAGE_SIZE:-50}
      AI_STREAM_STALE_MS: ${AI_STREAM_STALE_MS:-300000}
      AI_STREAM_IDLE_TIMEOUT_MS: ${AI_STREAM_IDLE_TIMEOUT_MS:-180000}
      AI_STREAM_TIMEOUT_MS: ${AI_STREAM_TIMEOUT_MS:-600000}
      CHAT_UPLOAD_DIR: /app/backend/storage/uploads
      CHAT_MAX_UPLOAD_BYTES: ${CHAT_MAX_UPLOAD_BYTES:-20971520}
      KNOWLEDGE_UPLOAD_DIR: /app/backend/storage/knowledge
      KNOWLEDGE_MAX_UPLOAD_BYTES: ${KNOWLEDGE_MAX_UPLOAD_BYTES:-10485760}
      KNOWLEDGE_SEARCH_LIMIT: ${KNOWLEDGE_SEARCH_LIMIT:-6}
      KNOWLEDGE_MIN_SCORE: ${KNOWLEDGE_MIN_SCORE:-0.4}
      KNOWLEDGE_SEARCH_OVERFETCH: ${KNOWLEDGE_SEARCH_OVERFETCH:-3}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-document_chunks}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-1024}
    volumes:
      - backend_storage:/app/backend/storage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # 知识库后台索引 Worker：消费 Redis 队列，解析/分块/向量化/写入 Qdrant
  knowledge-worker:
    image: aiplatform-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      ai-service:
        condition: service_started
      qdrant:
        condition: service_started
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ai_platform
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      AI_SERVICE_URL: http://ai-service:8000
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-180000}
      KNOWLEDGE_UPLOAD_DIR: /app/backend/storage/knowledge
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-document_chunks}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-1024}
    volumes:
      - backend_storage:/app/backend/storage
    command: ["node", "dist/worker.js"]

  # 整个部署唯一对外发布的端口：浏览器只访问 Nginx（静态资源 + /api + SSE）
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
  backend_storage:
