# ============================================================================
# 本地调试覆盖文件（可选）
#
# 默认 docker-compose.yml 只发布前端端口，MySQL / Redis / Qdrant 仅存在于
# Compose 内部网络。需要在宿主机用客户端连接数据服务时再叠加本文件：
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 所有调试端口只绑定 127.0.0.1，不对局域网开放。生产部署不要使用本文件。
# ============================================================================
services:
  mysql:
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"

  qdrant:
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6335}:6333"
